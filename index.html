<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>桜町 — Sakura City</title>
<style>
  :root {
    --ink: #2b2436;
    --paper: #fdf6f2;
    --pink: #e79ab6;
    --blue: #6f8fc4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #b9d4ea;
    font-family: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN",
                 "Noto Sans JP", "Meiryo", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; touch-action: none; }

  #ui { position: fixed; inset: 0; pointer-events: none; }

  /* ---- entrance -----------------------------------------------------------
     One screen, one transition. The old design had two: a loading screen
     that faded out, then a "tap to start" modal that faded out separately —
     two hard cuts before you ever saw the street. This is a single card that
     sits in front of a world which is already there and already moving; the
     only thing that changes is a line of text, and then rain. `#gate-bg` is
     the paper-gradient backdrop, drawn again in WebGL by reveal.js so the
     handover between the two has nothing to visibly cross. */
  #gate {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    /* Blocks the world underneath — including the touch stick, which sits at
       a lower z-index — for the entire wait. Only `.leaving` lets go of
       input, and by then the card itself has already faded to nothing. */
    pointer-events: auto;
  }
  #gate.ready { cursor: pointer; }
  #gate.leaving { pointer-events: none; }

  #gate-bg {
    position: absolute; inset: 0;
    background: linear-gradient(170deg, #cfe5f6 0%, #f4e3e8 58%, #fdeee2 100%);
    transition: opacity .7s ease;
  }
  #gate.ready #gate-bg { opacity: 0; }

  /* A handful of petals drifting down behind the card text — cheap (pure
     CSS), and it keeps the entrance from reading as a static splash image. */
  .gate-petal {
    position: absolute; top: -6%; width: 10px; height: 10px; border-radius: 60% 5% 60% 5%;
    background: rgba(231,154,182,.55); opacity: 0;
    animation: petal-fall linear infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: .8; }
    92%  { opacity: .55; }
    100% { transform: translate(var(--drift, 40px), 112vh) rotate(300deg); opacity: 0; }
  }

  #gate-card {
    position: relative; text-align: center; transition: opacity .4s ease, transform .4s ease;
  }
  #gate.leaving #gate-card { opacity: 0; transform: translateY(-8px); }
  #gate-card h1 {
    margin: 0; font-size: clamp(2.1rem, 7vw, 3.4rem); font-weight: 800;
    letter-spacing: .22em; text-indent: .22em; color: #46394f;
  }
  #gate-card .sub {
    margin: .5rem 0 0; letter-spacing: .3em; font-size: .78rem; color: #7a6a80;
  }
  #gate-cta {
    margin-top: 1.6rem; font-size: .76rem; letter-spacing: .2em; color: #9385a0;
    animation: gate-breathe 2.6s ease-in-out infinite;
  }
  #gate.ready #gate-cta {
    color: var(--pink); font-weight: 700; letter-spacing: .34em;
    animation: gate-breathe 1.8s ease-in-out infinite;
  }
  @keyframes gate-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  /* ---- help tab ---------------------------------------------------------
     A modal gate was the wrong shape for this: it covered the scene it was
     describing, and — because it sat over the whole viewport with pointer
     events on — it swallowed the very click that captures the cursor. This is
     a corner panel you can leave open or fold away; its state is remembered. */
  #help { position: fixed; z-index: 20; pointer-events: none;
          top: max(14px, env(safe-area-inset-top));
          right: max(14px, env(safe-area-inset-right));
          display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #help-toggle {
    pointer-events: auto; cursor: pointer; font: inherit; font-size: .72rem;
    letter-spacing: .14em; padding: .42rem .95rem; border-radius: 999px;
    color: var(--ink); border: 1px solid rgba(255,255,255,.5);
    background: rgba(253,246,242,.72); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 16px rgba(40,30,55,.18); transition: background .2s ease;
  }
  #help-toggle:hover { background: rgba(253,246,242,.92); }
  #help-panel {
    pointer-events: auto; width: 268px; max-width: calc(100vw - 28px);
    background: rgba(253,246,242,.88); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.55); border-radius: 14px;
    padding: 1rem 1.1rem 0.9rem; box-shadow: 0 12px 34px rgba(40,30,55,.22);
    transform-origin: top right; transition: opacity .22s ease, transform .22s ease;
  }
  #help:not(.open) #help-panel {
    opacity: 0; transform: scale(.94) translateY(-6px); pointer-events: none;
  }
  #help-panel h2 { margin: 0 0 .15rem; font-size: .92rem; letter-spacing: .12em; }
  #help-panel .lede { margin: 0 0 .75rem; font-size: .72rem; line-height: 1.75; color: #7a6a80; }
  #help-panel dl { display: grid; grid-template-columns: auto 1fr; gap: .34rem .8rem;
                   margin: 0; font-size: .74rem; color: #58495f; align-items: center; }
  #help-panel dt { margin: 0; }
  #help-panel dd { margin: 0; }
  #help-panel .foot { margin: .85rem 0 0; padding-top: .7rem; font-size: .66rem;
                      letter-spacing: .1em; color: #9385a0;
                      border-top: 1px solid rgba(120,100,130,.16); }
  kbd {
    font: inherit; font-size: .7rem; background: #efe4e8; border-radius: 6px;
    padding: .1rem .42rem; border-bottom: 2px solid #d9c7cf; white-space: nowrap;
  }

  /* Prompt to capture the cursor. Only on desktop, only while unlocked. */
  #click-hint {
    position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
    font-size: .72rem; letter-spacing: .16em; color: rgba(255,255,255,.9);
    text-shadow: 0 1px 8px rgba(35,25,45,.75);
    opacity: 0; transition: opacity .45s ease; pointer-events: none;
  }
  #click-hint.on { opacity: 1; }
  body.is-touch #click-hint { display: none; }

  /* ---- in-world hud ----------------------------------------------------- */
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 1rem 1.2rem;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: .7rem; letter-spacing: .12em; color: rgba(255,255,255,.82);
    text-shadow: 0 1px 6px rgba(35,25,45,.6);
    opacity: 0; transition: opacity .5s ease;
  }
  #hud.on { opacity: 1; }
  #hud .tag { opacity: .72; }
  #dot {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: rgba(255,255,255,.5);
    box-shadow: 0 0 0 1px rgba(40,30,50,.3); opacity: 0; transition: opacity .4s ease;
  }
  #dot.on { opacity: 1; }
  #toast {
    position: fixed; left: 50%; top: 12%; transform: translateX(-50%);
    background: rgba(30,24,38,.72); color: #fdf6f2; padding: .5rem 1.1rem;
    border-radius: 999px; font-size: .74rem; letter-spacing: .14em;
    opacity: 0; transition: opacity .35s ease;
  }
  #toast.on { opacity: 1; }

  /* One switch, set from JS once the pointer type is known — a width media
     query gets tablets and small desktop windows wrong in opposite ways.
     `#help-panel dl` sets display:grid with ID-level specificity, so the
     show/hide rules here have to match that specificity or they lose. */
  #help-panel .touch-keys { display: none; }
  body.is-touch #help-panel .desktop-keys { display: none; }
  body.is-touch #help-panel dl.touch-keys { display: grid; }
  body.is-touch #help-panel p.touch-keys { display: block; }
  /* On a phone the stick owns the bottom of the screen, so the HUD moves up —
     stacked on the left, clear of the help button in the opposite corner. */
  body.is-touch #hud {
    bottom: auto; top: 0; flex-direction: column; align-items: flex-start; gap: .2rem;
    padding-top: max(1rem, env(safe-area-inset-top)); padding-right: 6.5rem;
  }
  body.is-touch.help-open #hud { opacity: 0; }
</style>
</head>
<body>
  <div id="ui">
    <div id="dot"></div>
    <div id="hud">
      <div><span class="tag">桜町 二丁目</span> · SAKURA CITY</div>
      <div class="tag" id="status">踏切 — 待機中</div>
    </div>
    <div id="toast"></div>
    <div id="click-hint">クリックして視点操作</div>
  </div>

  <div id="help" class="open">
    <button id="help-toggle" type="button" aria-expanded="true" aria-controls="help-panel">
      操作
    </button>
    <div id="help-panel" role="region" aria-label="操作説明">
      <h2>桜町</h2>
      <p class="lede">春の午後、線路沿いの細い通り。<br />電車が来るまで、少し歩いてみてください。</p>
      <dl class="desktop-keys">
        <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>歩く</dd>
        <dt><kbd>Shift</kbd></dt><dd>走る</dd>
        <dt><kbd>マウス</kbd></dt><dd>見回す</dd>
        <dt><kbd>C</kbd></dt><dd>シネマティック</dd>
        <dt><kbd>M</kbd></dt><dd>サウンド</dd>
        <dt><kbd>Esc</kbd></dt><dd>カーソルを戻す</dd>
      </dl>
      <dl class="touch-keys">
        <dt><kbd>スティック</kbd></dt><dd>歩く</dd>
        <dt><kbd>ドラッグ</kbd></dt><dd>見回す</dd>
        <dt><kbd>端末を動かす</kbd></dt><dd>ジャイロで見回す</dd>
        <dt><kbd>ボタン</kbd></dt><dd>走る · ジャイロ · シネマ</dd>
      </dl>
      <p class="foot desktop-keys"><kbd>H</kbd> でこのパネルを開閉</p>
    </div>
  </div>

  <div id="gate">
    <div id="gate-bg"></div>
    <div class="gate-petal" style="left:12%; width:9px; height:9px; --drift:60px; animation-duration:9s; animation-delay:.2s"></div>
    <div class="gate-petal" style="left:26%; width:7px; height:7px; --drift:-40px; animation-duration:7.5s; animation-delay:1.6s"></div>
    <div class="gate-petal" style="left:41%; width:11px; height:11px; --drift:30px; animation-duration:10.5s; animation-delay:.9s"></div>
    <div class="gate-petal" style="left:58%; width:8px; height:8px; --drift:-55px; animation-duration:8.2s; animation-delay:2.4s"></div>
    <div class="gate-petal" style="left:73%; width:10px; height:10px; --drift:45px; animation-duration:9.8s; animation-delay:.1s"></div>
    <div class="gate-petal" style="left:87%; width:8px; height:8px; --drift:-30px; animation-duration:7s; animation-delay:1.3s"></div>
    <div id="gate-card">
      <h1>桜町</h1>
      <p class="sub">SAKURA CITY</p>
      <p id="gate-cta">支度をしています</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
