<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>桜町 — Sakura City</title>
<style>
  :root {
    --ink: #2b2436;
    --paper: #fdf6f2;
    --pink: #e79ab6;
    --blue: #6f8fc4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #b9d4ea;
    font-family: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN",
                 "Noto Sans JP", "Meiryo", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; touch-action: none; }

  #ui { position: fixed; inset: 0; pointer-events: none; }

  /* ---- entrance -----------------------------------------------------------
     One screen, one transition. The old design had two: a loading screen
     that faded out, then a "tap to start" modal that faded out separately —
     two hard cuts before you ever saw the street. This is a single card that
     sits in front of a world which is already there and already moving; the
     only thing that changes is a line of text, and then rain. `#gate-bg` is
     the paper-gradient backdrop, drawn again in WebGL by reveal.js so the
     handover between the two has nothing to visibly cross. */
  #gate {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    /* Blocks the world underneath — including the touch stick, which sits at
       a lower z-index — for the entire wait. Only `.leaving` lets go of
       input, and by then the card itself has already faded to nothing. */
    pointer-events: auto;
  }
  #gate.ready { cursor: pointer; }
  #gate.leaving { pointer-events: none; }

  #gate-bg {
    position: absolute; inset: 0;
    background: linear-gradient(170deg, #cfe5f6 0%, #f4e3e8 58%, #fdeee2 100%);
    transition: opacity .7s ease;
  }
  #gate.ready #gate-bg { opacity: 0; }

  /* A handful of petals drifting down behind the card text — cheap (pure
     CSS), and it keeps the entrance from reading as a static splash image. */
  .gate-petal {
    position: absolute; top: -6%; width: 10px; height: 10px; border-radius: 60% 5% 60% 5%;
    background: rgba(231,154,182,.55); opacity: 0;
    animation: petal-fall linear infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: .8; }
    92%  { opacity: .55; }
    100% { transform: translate(var(--drift, 40px), 112vh) rotate(300deg); opacity: 0; }
  }

  #gate-card {
    position: relative; text-align: center; transition: opacity .4s ease, transform .4s ease;
  }
  #gate.leaving #gate-card { opacity: 0; transform: translateY(-8px); }
  #gate-card h1 {
    margin: 0; font-size: clamp(2.1rem, 7vw, 3.4rem); font-weight: 800;
    letter-spacing: .22em; text-indent: .22em; color: #46394f;
  }
  #gate-card .sub {
    margin: .5rem 0 0; letter-spacing: .3em; font-size: .78rem; color: #7a6a80;
  }
  #gate-cta {
    margin-top: 1.6rem; font-size: .76rem; letter-spacing: .2em; color: #9385a0;
    animation: gate-breathe 2.6s ease-in-out infinite;
  }
  #gate.ready #gate-cta {
    color: var(--pink); font-weight: 700; letter-spacing: .34em;
    animation: gate-breathe 1.8s ease-in-out infinite;
  }
  @keyframes gate-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  /* Prompt to capture the cursor. Only on desktop, only while unlocked. */
  #click-hint {
    position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
    font-size: .72rem; letter-spacing: .16em; color: rgba(255,255,255,.9);
    text-shadow: 0 1px 8px rgba(35,25,45,.75);
    opacity: 0; transition: opacity .45s ease; pointer-events: none;
  }
  #click-hint.on { opacity: 1; }
  body.is-touch #click-hint { display: none; }

  #dot {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: rgba(255,255,255,.5);
    box-shadow: 0 0 0 1px rgba(40,30,50,.3); opacity: 0; transition: opacity .4s ease;
  }
  #dot.on { opacity: 1; }
  #toast {
    position: fixed; left: 50%; top: 12%; transform: translateX(-50%);
    background: rgba(30,24,38,.72); color: #fdf6f2; padding: .5rem 1.1rem;
    border-radius: 999px; font-size: .74rem; letter-spacing: .14em;
    opacity: 0; transition: opacity .35s ease;
  }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
  <div id="ui">
    <div id="dot"></div>
    <div id="toast"></div>
    <div id="click-hint">クリックして視点操作</div>
  </div>

  <div id="gate">
    <div id="gate-bg"></div>
    <div class="gate-petal" style="left:12%; width:9px; height:9px; --drift:60px; animation-duration:9s; animation-delay:.2s"></div>
    <div class="gate-petal" style="left:26%; width:7px; height:7px; --drift:-40px; animation-duration:7.5s; animation-delay:1.6s"></div>
    <div class="gate-petal" style="left:41%; width:11px; height:11px; --drift:30px; animation-duration:10.5s; animation-delay:.9s"></div>
    <div class="gate-petal" style="left:58%; width:8px; height:8px; --drift:-55px; animation-duration:8.2s; animation-delay:2.4s"></div>
    <div class="gate-petal" style="left:73%; width:10px; height:10px; --drift:45px; animation-duration:9.8s; animation-delay:.1s"></div>
    <div class="gate-petal" style="left:87%; width:8px; height:8px; --drift:-30px; animation-duration:7s; animation-delay:1.3s"></div>
    <div id="gate-card">
      <h1>桜町</h1>
      <p class="sub">SAKURA CITY</p>
      <p id="gate-cta">支度をしています</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
